# Personal credentials belong in your local secrets.yaml; never commit them.
external_components:
  - source: github://jasoncronje/autonomous-desk-esphome@main
    components: [desk_motion]

packages:
  controller: github://jasoncronje/autonomous-desk-esphome/config/controller.yaml@main

substitutions:
  uart_tx_pin: "17"
  uart_rx_pin: "4"
  desk_min_height: "75"
  desk_max_height: "123"

esphome:
  name: autonomous-desk
  friendly_name: Autonomous Desk

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret desk_api_encryption_key

ota:
  - platform: esphome
    password: !secret desk_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
