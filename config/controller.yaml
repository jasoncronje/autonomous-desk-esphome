# Replacement-controller package. Load the desk_motion external component.
substitutions:
  uart_tx_pin: "17"
  uart_rx_pin: "4"
  desk_min_height: "75"
  desk_max_height: "123"

desk_motion:

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          desk_draft::controller().set_limits(${desk_min_height}, ${desk_max_height});
          desk_draft::controller().set_manual_release_on_stop(true);
          desk_draft::controller().set_sender([](uint8_t command) {
            const uint8_t frame[] = {0xD8, 0xD8, 0x66, command, command};
            id(desk_uart).write_array(frame, sizeof(frame));
          });
  on_shutdown:
    priority: 700
    then:
      - lambda: |-
          desk_draft::controller().set_enabled(false, millis());
          desk_draft::controller().tick(millis(), false);

api:
  id: desk_api
  on_client_disconnected:
    then:
      - lambda: desk_draft::controller().disconnect(millis());
  actions:
    - action: desk_hold_start
      variables:
        direction: int
        token: int
      then:
        - lambda: |-
            if (token > 0) desk_draft::controller().start_hold(direction, token, millis());
    - action: desk_hold_renew
      variables:
        token: int
      then:
        - lambda: |-
            if (token > 0) desk_draft::controller().renew_hold(token, millis());
    - action: desk_hold_release
      variables:
        token: int
      then:
        - lambda: |-
            if (token > 0) desk_draft::controller().release_hold(token, millis());

uart:
  id: desk_uart
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  baud_rate: 9600
  parity: NONE
  stop_bits: 1
  data_bits: 8
  debug:
    direction: RX
    dummy_receiver: true
    after:
      bytes: 6
      timeout: 10ms
    sequence:
      - lambda: desk_draft::controller().feed(bytes.data(), bytes.size(), millis());

interval:
  - interval: 10ms
    then:
      - lambda: |-
          desk_draft::controller().tick(millis(), id(desk_api).is_connected());
          if (!desk_draft::controller().enabled() && id(desk_motion_enabled).state)
            id(desk_motion_enabled).publish_state(false);

switch:
  - platform: template
    name: "Motion Enabled"
    id: desk_motion_enabled
    icon: mdi:lock-open-variant
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: desk_draft::controller().set_enabled(true, millis());
    turn_off_action:
      - lambda: desk_draft::controller().set_enabled(false, millis());

button:
  - platform: template
    name: "Stop"
    id: desk_stop
    icon: mdi:stop-circle
    on_press:
      - switch.turn_off: desk_motion_enabled
  - platform: template
    name: "Move Up"
    id: desk_hold_up
    icon: mdi:arrow-up-bold
    on_press:
      - lambda: desk_draft::controller().hold(1, millis());
  - platform: template
    name: "Move Down"
    id: desk_hold_down
    icon: mdi:arrow-down-bold
    on_press:
      - lambda: desk_draft::controller().hold(-1, millis());
  - platform: template
    name: "Nudge Up"
    id: desk_up
    icon: mdi:arrow-up-bold-box-outline
    on_press:
      - lambda: desk_draft::controller().nudge(1, millis());
  - platform: template
    name: "Nudge Down"
    id: desk_down
    icon: mdi:arrow-down-bold-box-outline
    on_press:
      - lambda: desk_draft::controller().nudge(-1, millis());

number:
  - platform: template
    name: "Height"
    id: desk_height
    icon: mdi:human-male-height-variant
    min_value: ${desk_min_height}
    max_value: ${desk_max_height}
    step: 1
    mode: slider
    update_interval: 100ms
    lambda: |-
      if (!desk_draft::controller().fresh(millis())) return NAN;
      return desk_draft::controller().height();
    set_action:
      - lambda: desk_draft::controller().target(x, millis());
  - platform: template
    name: "Height (inches)"
    id: desk_height_inches
    unit_of_measurement: in
    min_value: 29.5
    max_value: 48.4
    step: 0.1
    mode: box
    update_interval: 100ms
    lambda: |-
      if (!desk_draft::controller().fresh(millis())) return NAN;
      return desk_draft::Controller::inches(desk_draft::controller().height());
    set_action:
      - lambda: |-
          if (std::isfinite(x) && x >= 29.5f && x <= 48.4f)
            desk_draft::controller().target(desk_draft::controller().raw_from_inches(x), millis());
          else
            desk_draft::controller().stop(millis(), "Invalid inches target");

sensor:
  - platform: template
    name: "Height (inches)"
    id: desk_converted_height
    unit_of_measurement: in
    update_interval: 100ms
    lambda: |-
      if (!desk_draft::controller().fresh(millis())) return NAN;
      return desk_draft::Controller::inches(desk_draft::controller().height());

binary_sensor:
  - platform: template
    name: "Moving"
    id: desk_moving
    device_class: moving
    lambda: return desk_draft::controller().moving(millis());

text_sensor:
  - platform: template
    name: "Motion Status"
    update_interval: 250ms
    lambda: return {desk_draft::controller().status()};

select:
  - platform: template
    name: "Jump to Memory Preset"
    id: desk_jump_to_memory_preset
    icon: mdi:debug-step-over
    options: ["N/A", "1", "2", "3", "4"]
    initial_option: "N/A"
    optimistic: false
    set_action:
      - lambda: |-
          if (x != "N/A") desk_draft::controller().preset(x[0] - '0', millis());
          else desk_draft::controller().stop(millis());
          id(desk_jump_to_memory_preset).publish_state("N/A");
  - platform: template
    name: "Set Height to Memory Preset"
    id: desk_set_to_memory_preset
    icon: mdi:content-save
    options: ["N/A", "1", "2", "3", "4"]
    initial_option: "N/A"
    optimistic: false
    set_action:
      - lambda: |-
          if (x != "N/A") desk_draft::controller().save(x[0] - '0', millis());
          else desk_draft::controller().stop(millis());
          id(desk_set_to_memory_preset).publish_state("N/A");
